[theme]
base = "dark"
primaryColor = "#D4AF61"
backgroundColor = "#0E0F0D"
secondaryBackgroundColor = "#1C1813"
textColor = "#E8DCC0"
font = "serif"

[server]
# Sirve la carpeta static/ (fondo de la calle y avatar de Holmes) en app/static/
enableStaticServing = true

[client]
toolbarMode = "minimal"
