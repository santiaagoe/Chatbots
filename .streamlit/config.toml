[theme]
base = "light"
primaryColor = "#8E1F1A"
backgroundColor = "#4A2A18"
secondaryBackgroundColor = "#EFE4C9"
textColor = "#2B1E12"
font = "serif"

[server]
# Sirve la carpeta static/ (foto de la calle y medallón de Holmes) en app/static/
enableStaticServing = true

[client]
toolbarMode = "minimal"
